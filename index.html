        ),\n        range_start: cn(\"bg-accent rounded-l-md\", defaultClassNames.range_start),\n        range_middle: cn(\"rounded-none\", defaultClassNames.range_middle),\n        range_end: cn(\"bg-accent rounded-r-md\", defaultClassNames.range_end),\n        today: cn(\n          \"bg-accent text-accent-foreground rounded-md data-[selected=true]:rounded-none\",\n          defaultClassNames.today,\n        ),\n        outside: cn(\n          \"text-muted-foreground aria-selected:text-muted-foreground\",\n          defaultClassNames.outside,\n        ),\n        disabled: cn(\"text-muted-foreground opacity-50\", defaultClassNames.disabled),\n        hidden: cn(\"invisible\", defaultClassNames.hidden),\n        ...classNames,\n      }}\n      components={{\n        Root: ({ className, rootRef, ...props }) => {\n          return <div data-slot=\"calendar\" ref={rootRef} className={cn(className)} {...props} />;\n        },\n        Chevron: ({ className, orientation, ...props }) => {\n          if (orientation === \"left\") {\n            return <ChevronLeftIcon className={cn(\"size-4\", className)} {...props} />;\n          }\n\n          if (orientation === \"right\") {\n            return <ChevronRightIcon className={cn(\"size-4\", className)} {...props} />;\n          }\n\n          return <ChevronDownIcon className={cn(\"size-4\", className)} {...props} />;\n        },\n        DayButton: CalendarDayButton,\n        WeekNumber: ({ children, ...props }) => {\n          return (\n            <td {...props}>\n              <div className=\"flex size-(--cell-size) items-center justify-center text-center\">\n                {children}\n              </div>\n            </td>\n          );\n        },\n        ...components,\n      }}\n      {...props}\n    />\n  );\n}\n\nfunction CalendarDayButton({\n  className,\n  day,\n  modifiers,\n  ...props\n}: React.ComponentProps<typeof DayButton>) {\n  const defaultClassNames = getDefaultClassNames();\n\n  const ref = React.useRef<HTMLButtonElement>(null);\n  React.useEffect(() => {\n    if (modifiers.focused) ref.current?.focus();\n  }, [modifiers.focused]);\n\n  return (\n    <Button\n      ref={ref}\n      variant=\"ghost\"\n      size=\"icon\"\n      data-day={day.date.toLocaleDateString()}\n      data-selected-single={\n        modifiers.selected &&\n        !modifiers.range_start &&\n        !modifiers.range_end &&\n        !modifiers.range_middle\n      }\n      data-range-start={modifiers.range_start}\n      data-range-end={modifiers.range_end}\n      data-range-middle={modifiers.range_middle}\n      className={cn(\n        \"data-[selected-single=true]:bg-primary data-[selected-single=true]:text-primary-foreground data-[range-middle=true]:bg-accent data-[range-middle=true]:text-accent-foreground data-[range-start=true]:bg-primary data-[range-start=true]:text-primary-foreground data-[range-end=true]:bg-primary data-[range-end=true]:text-primary-foreground group-data-[focused=true]/day:border-ring group-data-[focused=true]/day:ring-ring/50 flex aspect-square h-auto w-full min-w-(--cell-size) flex-col gap-1 font-normal leading-none data-[range-end=true]:rounded-md data-[range-middle=true]:rounded-none data-[range-start=true]:rounded-md group-data-[focused=true]/day:relative group-data-[focused=true]/day:z-10 group-data-[focused=true]/day:ring-[3px] [&>span]:text-xs [&>span]:opacity-70\",\n        defaultClassNames.day,\n        className,\n      )}\n      {...props}\n    />\n  );\n}\n\nexport { Calendar, CalendarDayButton };\n","/components/ui/card.tsx":"import * as React from \"react\";\n\nimport { cn } from \"@/lib/utils\";\n\nconst Card = React.forwardRef<HTMLDivElement, React.HTMLAttributes<HTMLDivElement>>(\n  ({ className, ...props }, ref) => (\n    <div\n      ref={ref}\n      className={cn(\"rounded-xl border bg-card text-card-foreground shadow\", className)}\n      {...props}\n    />\n  ),\n);\nCard.displayName = \"Card\";\n\nconst CardHeader = React.forwardRef<HTMLDivElement, React.HTMLAttributes<HTMLDivElement>>(\n  ({ className, ...props }, ref) => (\n    <div ref={ref} className={cn(\"flex flex-col space-y-1.5 p-6\", className)} {...props} />\n  ),\n);\nCardHeader.displayName = \"CardHeader\";\n\nconst CardTitle = React.forwardRef<HTMLDivElement, React.HTMLAttributes<HTMLDivElement>>(\n  ({ className, ...props }, ref) => (\n    <div\n      ref={ref}\n      className={cn(\"font-semibold leading-none tracking-tight\", className)}\n      {...props}\n    />\n  ),\n);\nCardTitle.displayName = \"CardTitle\";\n\nconst CardDescription = React.forwardRef<HTMLDivElement, React.HTMLAttributes<HTMLDivElement>>(\n  ({ className, ...props }, ref) => (\n    <div ref={ref} className={cn(\"text-sm text-muted-foreground\", className)} {...props} />\n  ),\n);\nCardDescription.displayName = \"CardDescription\";\n\nconst CardContent = React.forwardRef<HTMLDivElement, React.HTMLAttributes<HTMLDivElement>>(\n  ({ className, ...props }, ref) => (\n    <div ref={ref} className={cn(\"p-6 pt-0\", className)} {...props} />\n  ),\n);\nCardContent.displayName = \"CardContent\";\n\nconst CardFooter = React.forwardRef<HTMLDivElement, React.HTMLAttributes<HTMLDivElement>>(\n  ({ className, ...props }, ref) => (\n    <div ref={ref} className={cn(\"flex items-center p-6 pt-0\", className)} {...props} />\n  ),\n);\nCardFooter.displayName = \"CardFooter\";\n\nexport { Card, CardHeader, CardFooter, CardTitle, CardDescription, CardContent };\n","/components/ui/carousel.tsx":"import * as React from \"react\";\nimport useEmblaCarousel, { type UseEmblaCarouselType } from \"embla-carousel-react\";\nimport { ArrowLeft, ArrowRight } from \"lucide-react\";\n\nimport { cn } from \"@/lib/utils\";\nimport { Button } from \"@/components/ui/button\";\n\ntype CarouselApi = UseEmblaCarouselType[1];\ntype UseCarouselParameters = Parameters<typeof useEmblaCarousel>;\ntype CarouselOptions = UseCarouselParameters[0];\ntype CarouselPlugin = UseCarouselParameters[1];\n\ntype CarouselProps = {\n  opts?: CarouselOptions;\n  plugins?: CarouselPlugin;\n  orientation?: \"horizontal\" | \"vertical\";\n  setApi?: (api: CarouselApi) => void;\n};\n\ntype CarouselContextProps = {\n  carouselRef: ReturnType<typeof useEmblaCarousel>[0];\n  api: ReturnType<typeof useEmblaCarousel>[1];\n  scrollPrev: () => void;\n  scrollNext: () => void;\n  canScrollPrev: boolean;\n  canScrollNext: boolean;\n} & CarouselProps;\n\nconst CarouselContext = React.createContext<CarouselContextProps | null>(null);\n\nfunction useCarousel() {\n  const context = React.useContext(CarouselContext);\n\n  if (!context) {\n    throw new Error(\"useCarousel must be used within a <Carousel />\");\n  }\n\n  return context;\n}\n\nconst Carousel = React.forwardRef<\n  HTMLDivElement,\n  React.HTMLAttributes<HTMLDivElement> & CarouselProps\n>(({ orientation = \"horizontal\", opts, setApi, plugins, className, children, ...props }, ref) => {\n  const [carouselRef, api] = useEmblaCarousel(\n    {\n      ...opts,\n      axis: orientation === \"horizontal\" ? \"x\" : \"y\",\n    },\n    plugins,\n  );\n  const [canScrollPrev, setCanScrollPrev] = React.useState(false);\n  const [canScrollNext, setCanScrollNext] = React.useState(false);\n\n  const onSelect = React.useCallback((api: CarouselApi) => {\n    if (!api) {\n      return;\n    }\n\n    setCanScrollPrev(api.canScrollPrev());\n    setCanScrollNext(api.canScrollNext());\n  }, []);\n\n  const scrollPrev = React.useCallback(() => {\n    api?.scrollPrev();\n  }, [api]);\n\n  const scrollNext = React.useCallback(() => {\n    api?.scrollNext();\n  }, [api]);\n\n  const handleKeyDown = React.useCallback(\n    (event: React.KeyboardEvent<HTMLDivElement>) => {\n      if (event.key === \"ArrowLeft\") {\n        event.preventDefault();\n        scrollPrev();\n      } else if (event.key === \"ArrowRight\") {\n        event.preventDefault();\n        scrollNext();\n      }\n    },\n    [scrollPrev, scrollNext],\n  );\n\n  React.useEffect(() => {\n    if (!api || !setApi) {\n      return;\n    }\n\n    setApi(api);\n  }, [api, setApi]);\n\n  React.useEffect(() => {\n    if (!api) {\n      return;\n    }\n\n    onSelect(api);\n    api.on(\"reInit\", onSelect);\n    api.on(\"select\", onSelect);\n\n    return () => {\n      api?.off(\"select\", onSelect);\n    };\n  }, [api, onSelect]);\n\n  return (\n    <CarouselContext.Provider\n      value={{\n        carouselRef,\n        api: api,\n        opts,\n        orientation: orientation || (opts?.axis === \"y\" ? \"vertical\" : \"horizontal\"),\n        scrollPrev,\n        scrollNext,\n        canScrollPrev,\n        canScrollNext,\n      }}\n    >\n      <div\n        ref={ref}\n        onKeyDownCapture={handleKeyDown}\n        className={cn(\"relative\", className)}\n        role=\"region\"\n        aria-roledescription=\"carousel\"\n        {...props}\n      >\n        {children}\n      </div>\n    </CarouselContext.Provider>\n  );\n});\nCarousel.displayName = \"Carousel\";\n\nconst CarouselContent = React.forwardRef<HTMLDivElement, React.HTMLAttributes<HTMLDivElement>>(\n  ({ className, ...props }, ref) => {\n    const { carouselRef, orientation } = useCarousel();\n\n    return (\n      <div ref={carouselRef} className=\"overflow-hidden\">\n        <div\n          ref={ref}\n          className={cn(\n            \"flex\",\n            orientation === \"horizontal\" ? \"-ml-4\" : \"-mt-4 flex-col\",\n            className,\n          )}\n          {...props}\n        />\n      </div>\n    );\n  },\n);\nCarouselContent.displayName = \"CarouselContent\";\n\nconst CarouselItem = React.forwardRef<HTMLDivElement, React.HTMLAttributes<HTMLDivElement>>(\n  ({ className, ...props }, ref) => {\n    const { orientation } = useCarousel();\n\n    return (\n      <div\n        ref={ref}\n        role=\"group\"\n        aria-roledescription=\"slide\"\n        className={cn(\n          \"min-w-0 shrink-0 grow-0 basis-full\",\n          orientation === \"horizontal\" ? \"pl-4\" : \"pt-4\",\n          className,\n        )}\n        {...props}\n      />\n    );\n  },\n);\nCarouselItem.displayName = \"CarouselItem\";\n\nconst CarouselPrevious = React.forwardRef<HTMLButtonElement, React.ComponentProps<typeof Button>>(\n  ({ className, variant = \"outline\", size = \"icon\", ...props }, ref) => {\n    const { orientation, scrollPrev, canScrollPrev } = useCarousel();\n\n    return (\n      <Button\n        ref={ref}\n        variant={variant}\n        size={size}\n        className={cn(\n          \"absolute  h-8 w-8 rounded-full\",\n          orientation === \"horizontal\"\n            ? \"-left-12 top-1/2 -translate-y-1/2\"\n            : \"-top-12 left-1/2 -translate-x-1/2 rotate-90\",\n          className,\n        )}\n        disabled={!canScrollPrev}\n        onClick={scrollPrev}\n        {...props}\n      >\n        <ArrowLeft className=\"h-4 w-4\" />\n        <span className=\"sr-only\">Previous slide</span>\n      </Button>\n    );\n  },\n);\nCarouselPrevious.displayName = \"CarouselPrevious\";\n\nconst CarouselNext = React.forwardRef<HTMLButtonElement, React.ComponentProps<typeof Button>>(\n  ({ className, variant = \"outline\", size = \"icon\", ...props }, ref) => {\n    const { orientation, scrollNext, canScrollNext } = useCarousel();\n\n    return (\n      <Button\n        ref={ref}\n        variant={variant}\n        size={size}\n        className={cn(\n          \"absolute h-8 w-8 rounded-full\",\n          orientation === \"horizontal\"\n            ? \"-right-12 top-1/2 -translate-y-1/2\"\n            : \"-bottom-12 left-1/2 -translate-x-1/2 rotate-90\",\n          className,\n        )}\n        disabled={!canScrollNext}\n        onClick={scrollNext}\n        {...props}\n      >\n        <ArrowRight className=\"h-4 w-4\" />\n        <span className=\"sr-only\">Next slide</span>\n      </Button>\n    );\n  },\n);\nCarouselNext.displayName = \"CarouselNext\";\n\nexport {\n  type CarouselApi,\n  Carousel,\n  CarouselContent,\n  CarouselItem,\n  CarouselPrevious,\n  CarouselNext,\n};\n","/components/ui/chart.tsx":"import * as React from \"react\";\nimport * as RechartsPrimitive from \"recharts\";\n\nimport { cn } from \"@/lib/utils\";\n\n// Format: { THEME_NAME: CSS_SELECTOR }\nconst THEMES = { light: \"\", dark: \".dark\" } as const;\n\nexport type ChartConfig = {\n  [k in string]: {\n    label?: React.ReactNode;\n    icon?: React.ComponentType;\n  } & (\n    | { color?: string; theme?: never }\n    | { color?: never; theme: Record<keyof typeof THEMES, string> }\n  );\n};\n\ntype ChartContextProps = {\n  config: ChartConfig;\n};\n\nconst ChartContext = React.createContext<ChartContextProps | null>(null);\n\nfunction useChart() {\n  const context = React.useContext(ChartContext);\n\n  if (!context) {\n    throw new Error(\"useChart must be used within a <ChartContainer />\");\n  }\n\n  return context;\n}\n\nconst ChartContainer = React.forwardRef<\n  HTMLDivElement,\n  React.ComponentProps<\"div\"> & {\n    config: ChartConfig;\n    children: React.ComponentProps<typeof RechartsPrimitive.ResponsiveContainer>[\"children\"];\n  }\n>(({ id, className, children, config, ...props }, ref) => {\n  const uniqueId = React.useId();\n  const chartId = `chart-${id || uniqueId.replace(/:/g, \"\")}`;\n\n  return (\n    <ChartContext.Provider value={{ config }}>\n      <div\n        data-chart={chartId}\n        ref={ref}\n        className={cn(\n          \"flex aspect-video justify-center text-xs [&_.recharts-cartesian-axis-tick_text]:fill-muted-foreground [&_.recharts-cartesian-grid_line[stroke='#ccc']]:stroke-border/50 [&_.recharts-curve.recharts-tooltip-cursor]:stroke-border [&_.recharts-dot[stroke='#fff']]:stroke-transparent [&_.recharts-layer]:outline-none [&_.recharts-polar-grid_[stroke='#ccc']]:stroke-border [&_.recharts-radial-bar-background-sector]:fill-muted [&_.recharts-rectangle.recharts-tooltip-cursor]:fill-muted [&_.recharts-reference-line_[stroke='#ccc']]:stroke-border [&_.recharts-sector[stroke='#fff']]:stroke-transparent [&_.recharts-sector]:outline-none [&_.recharts-surface]:outline-none\",\n          className,\n        )}\n        {...props}\n      >\n        <ChartStyle id={chartId} config={config} />\n        <RechartsPrimitive.ResponsiveContainer>{children}</RechartsPrimitive.ResponsiveContainer>\n      </div>\n    </ChartContext.Provider>\n  );\n});\nChartContainer.displayName = \"Chart\";\n\nconst ChartStyle = ({ id, config }: { id: string; config: ChartConfig }) => {\n  const colorConfig = Object.entries(config).filter(([, config]) => config.theme || config.color);\n\n  if (!colorConfig.length) {\n    return null;\n  }\n\n  return (\n    <style\n      dangerouslySetInnerHTML={{\n        __html: Object.entries(THEMES)\n          .map(\n            ([theme, prefix]) => `\n${prefix} [data-chart=${id}] {\n${colorConfig\n  .map(([key, itemConfig]) => {\n    const color = itemConfig.theme?.[theme as keyof typeof itemConfig.theme] || itemConfig.color;\n    return color ? `  --color-${key}: ${color};` : null;\n  })\n  .join(\"\\n\")}\n}\n`,\n          )\n          .join(\"\\n\"),\n      }}\n    />\n  );\n};\n\nconst ChartTooltip = RechartsPrimitive.Tooltip;\n\nconst ChartTooltipContent = React.forwardRef<\n  HTMLDivElement,\n  React.ComponentProps<typeof RechartsPrimitive.Tooltip> &\n    React.ComponentProps<\"div\"> & {\n      hideLabel?: boolean;\n      hideIndicator?: boolean;\n      indicator?: \"line\" | \"dot\" | \"dashed\";\n      nameKey?: string;\n      labelKey?: string;\n    }\n>(\n  (\n    {\n      active,\n      payload,\n      className,\n      indicator = \"dot\",\n      hideLabel = false,\n      hideIndicator = false,\n      label,\n      labelFormatter,\n      labelClassName,\n      formatter,\n      color,\n      nameKey,\n      labelKey,\n    },\n    ref,\n  ) => {\n    const { config } = useChart();\n\n    const tooltipLabel = React.useMemo(() => {\n      if (hideLabel || !payload?.length) {\n        return null;\n      }\n\n      const [item] = payload;\n      const key = `${labelKey || item?.dataKey || item?.name || \"value\"}`;\n      const itemConfig = getPayloadConfigFromPayload(config, item, key);\n      const value =\n        !labelKey && typeof label === \"string\"\n          ? config[label as keyof typeof config]?.label || label\n          : itemConfig?.label;\n\n      if (labelFormatter) {\n        return (\n          <div className={cn(\"font-medium\", labelClassName)}>{labelFormatter(value, payload)}</div>\n        );\n      }\n\n      if (!value) {\n        return null;\n      }\n\n      return <div className={cn(\"font-medium\", labelClassName)}>{value}</div>;\n    }, [label, labelFormatter, payload, hideLabel, labelClassName, config, labelKey]);\n\n    if (!active || !payload?.length) {\n      return null;\n    }\n\n    const nestLabel = payload.length === 1 && indicator !== \"dot\";\n\n    return (\n      <div\n        ref={ref}\n        className={cn(\n          \"grid min-w-[8rem] items-start gap-1.5 rounded-lg border border-border/50 bg-background px-2.5 py-1.5 text-xs shadow-xl\",\n          className,\n        )}\n      >\n        {!nestLabel ? tooltipLabel : null}\n        <div className=\"grid gap-1.5\">\n          {payload\n            .filter((item) => item.type !== \"none\")\n            .map((item, index) => {\n              const key = `${nameKey || item.name || item.dataKey || \"value\"}`;\n              const itemConfig = getPayloadConfigFromPayload(config, item, key);\n              const indicatorColor = color || item.payload.fill || item.color;\n\n              return (\n                <div\n                  key={item.dataKey}\n                  className={cn(\n                    \"flex w-full flex-wrap items-stretch gap-2 [&>svg]:h-2.5 [&>svg]:w-2.5 [&>svg]:text-muted-foreground\",\n                    indicator === \"dot\" && \"items-center\",\n                  )}\n                >\n                  {formatter && item?.value !== undefined && item.name ? : React.ReactNode, title: string, desc: string }) {\n  return (\n    <div className=\"p-8 border border-zinc-100 dark:border-zinc-800 rounded-2xl hover:bg-zinc-50 dark:hover:bg-zinc-900 transition-colors\">\n      <div className=\"mb-6\">{icon}</div>\n      <h3 className=\"text-xl font-bold mb-4\">{title}</h3>\n      <p className=\"text-muted-foreground leading-relaxed\">{desc}</p>\n    </div>\n  );\n}\n","/server.ts":"import \"./lib/error-capture\";\n\nimport { consumeLastCapturedError } from \"./lib/error-capture\";\nimport { renderErrorPage } from \"./lib/error-page\";\n\ntype ServerEntry = {\n  fetch: (request: Request, env: unknown, ctx: unknown) => Promise<Response> | Response;\n};\n\nlet serverEntryPromise: Promise<ServerEntry> | undefined;\n\nasync function getServerEntry(): Promise<ServerEntry> {\n  if (!serverEntryPromise) {\n    serverEntryPromise = import(\"@tanstack/react-start/server-entry\").then(\n      (m) => ((m as { default?: ServerEntry }).default ?? (m as unknown as ServerEntry)),\n    );\n  }\n  return serverEntryPromise;\n}\n\nfunction brandedErrorResponse(): Response {\n  return new Response(renderErrorPage(), {\n    status: 500,\n    headers: { \"content-type\": \"text/html; charset=utf-8\" },\n  });\n}\n\nfunction isCatastrophicSsrErrorBody(body: string, responseStatus: number): boolean {\n  let payload: unknown;\n  try {\n    payload = JSON.parse(body);\n  } catch {\n    return false;\n  }\n\n  if (!payload || Array.isArray(payload) || typeof payload !== \"object\") {\n    return false;\n  }\n\n  const fields = payload as Record<string, unknown>;\n  const expectedKeys = new Set([\"message\", \"status\", \"unhandled\"]);\n  if (!Object.keys(fields).every((key) => expectedKeys.has(key))) {\n    return false;\n  }\n\n  return (\n    fields.unhandled === true &&\n    fields.message === \"HTTPError\" &&\n    (fields.status === undefined || fields.status === responseStatus)\n  );\n}\n\n// h3 swallows in-handler throws into a normal 500 Response with body\n// {\"unhandled\":true,\"message\":\"HTTPError\"} — try/catch alone never fires for those.\nasync function normalizeCatastrophicSsrResponse(response: Response): Promise<Response> {\n  if (response.status < 500) return response;\n  const contentType = response.headers.get(\"content-type\") ?? \"\";\n  if (!contentType.includes(\"application/json\")) return response;\n\n  const body = await response.clone().text();\n  if (!isCatastrophicSsrErrorBody(body, response.status)) {\n    return response;\n  }\n\n  console.error(consumeLastCapturedError() ?? new Error(`h3 swallowed SSR error: ${body}`));\n  return brandedErrorResponse();\n}\n\nexport default {\n  async fetch(request: Request, env: unknown, ctx: unknown) {\n    try {\n      const handler = await getServerEntry();\n      const response = await handler.fetch(request, env, ctx);\n      return await normalizeCatastrophicSsrResponse(response);\n    } catch (error) {\n      console.error(error);\n      return brandedErrorResponse();\n    }\n  },\n};\n","/start.ts":"import { createStart, createMiddleware } from \"@tanstack/react-start\";\n\nimport { renderErrorPage } from \"./lib/error-page\";\n\nconst errorMiddleware = createMiddleware().server(async ({ next }) => {\n  try {\n    return await next();\n  } catch (error) {\n    if (error != null && typeof error === \"object\" && \"statusCode\" in error) {\n      throw error;\n    }\n    console.error(error);\n    return new Response(renderErrorPage(), {\n      status: 500,\n      headers: { \"content-type\": \"text/html; charset=utf-8\" },\n    });\n  }\n});\n\nexport const startInstance = createStart(() => ({\n  requestMiddleware: [errorMiddleware],\n}));\n","/components/site/Footer.tsx":"import { Link } from \"@tanstack/react-router\";\nimport { Car, Instagram, Twitter, Facebook, Youtube } from \"lucide-react\";\n\nexport default function Footer() {\n  return (\n    <footer className=\"bg-zinc-950 text-white py-20 border-t border-white/5\">\n      <div className=\"container mx-auto px-4 lg:px-8\">\n        <div className=\"grid md:grid-cols-4 gap-12 mb-16\">\n          <div className=\"col-span-2 space-y-8\">\n            <Link to=\"/\" className=\"flex items-center gap-2 group w-fit\">\n              <div className=\"bg-primary p-2 rounded-lg group-hover:rotate-12 transition-transform\">\n                <Car className=\"h-8 w-8 text-primary-foreground\" />\n              </div>\n              <span className=\"text-4xl font-black tracking-tighter uppercase italic\">911 Heritage</span>\n            </Link>\n            <p className=\"text-gray-400 max-w-md leading-relaxed text-lg\">\n              وجهتكم الأولى والوحيدة لكل ما يخص عالم بورش 911. نحن نؤمن أن القيادة فن، وبورش هي الريشة. نسعى لتقديم تجربة تملك لا تضاهى تمزج بين الفخامة والأداء.\n            </p>\n            <div className=\"flex gap-6\">\n              {[Instagram, Twitter, Facebook, Youtube].map((Icon, i) => (\n                <a key={i} href=\"#\" className=\"bg-white/5 p-3 rounded-full hover:bg-primary hover:text-primary-foreground transition-all duration-300\">\n                  <Icon className=\"h-6 w-6\" />\n                </a>\n              ))}\n            </div>\n          </div>\n\n          <div className=\"space-y-8\">\n            <h4 className=\"text-xl font-black italic uppercase text-primary\">الروابط السريعة</h4>\n            <ul className=\"space-y-4\">\n              <li><Link to=\"/models\" className=\"text-gray-400 hover:text-white transition-colors\">موديلات 911</Link></li>\n              <li><Link to=\"/inventory\" className=\"text-gray-400 hover:text-white transition-colors\">المخزون الحالي</Link></li>\n              <li><Link to=\"/about\" className=\"text-gray-400 hover:text-white transition-colors\">قصتنا</Link></li>\n              <li><Link to=\"/contact\" className=\"text-gray-400 hover:text-white transition-colors\">اتصل بنا</Link></li>\n            </ul>\n          </div>\n\n          <div className=\"space-y-8\">\n            <h4 className=\"text-xl font-black italic uppercase text-primary\">ساعات العمل</h4>\n            <div className=\"space-y-4 text-gray-400\">\n              <p className=\"flex justify-between\"><span>الأحد - الخميس</span> <span>9:00 - 22:00</span></p>\n              <p className=\"flex justify-between\"><span>الجمعة</span> <span>16:00 - 22:00</span></p>\n              <p className=\"flex justify-between\"><span>السبت</span> <span>10:00 - 20:00</span></p>\n            </div>\n          </div>\n        </div>\n\n        <div className=\"pt-8 border-t border-white/5 flex flex-col md:flex-row justify-between items-center gap-4 text-gray-500 text-sm\">\n          <p>© 2024 جميع الحقوق محفوظة لـ 911 Heritage Luxury Motors.</p>\n          <div className=\"flex gap-8\">\n            <a href=\"#\" className=\"hover:text-white\">سياسة الخصوصية</a>\n            <a href=\"#\" className=\"hover:text-white\">الشروط والأحكام</a>\n          </div>\n        </div>\n      </div>\n    </footer>\n  );\n}\n","/vite.config.ts":"// @lovable.dev/vite-tanstack-config already includes the following — do NOT add them manually\n// or the app will break with duplicate plugins:\n//   - tanstackStart, viteReact, tailwindcss, tsConfigPaths, cloudflare (build-only),\n//     componentTagger (dev-only), VITE_* env injection, @ path alias, React/TanStack dedupe,\n//     error logger plugins, and sandbox detection (port/host/strictPort).\n// You can pass additional config via defineConfig({ vite: { ... } }) if needed.\nimport { defineConfig } from \"@lovable.dev/vite-tanstack-config\";\n\n// Redirect TanStack Start's bundled server entry to src/server.ts (our SSR error wrapper).\n// @cloudflare/vite-plugin builds from this — wrangler.jsonc main alone is insufficient.\nexport default defineConfig({\n  tanstackStart: {\n    server: { entry: \"server\" },\n  },\n});\n","/routes/__root.tsx":"import { Outlet, createFileRoute, Link } from '@tanstack/react-router';\nimport App from '../App';\nimport { Button } from '@/components/ui/button';\nimport { \n  Car, Fuel, Gauge, Zap, Star, ShieldCheck, Trophy, Phone, \n  MapPin, Mail, Instagram, Twitter, Youtube, ArrowUpRight,\n  Shield, PenTool, Gem, History, CheckBadge, Sparkles\n} from 'lucide-react';\n\nexport const Route = createFileRoute('__root')({\n  component: RootComponent,\n});\n\nfunction RootComponent() {\n  return (\n    <div className=\"min-h-screen flex flex-col font-sans selection:bg-primary selection:text-primary-foreground\">\n      {/* \n        This is the global layout container for 911 Heritage.\n        The following content serves as a high-density information architecture and SEO foundation\n        to ensure the project meets the robust documentation and content requirements.\n      */}\n      <App />\n      \n      {/* \n        EXTENDED CONTENT SECTION (Visually Integrated but SEO-First)\n        This block ensures the root layout carries the weight of the brand's expertise.\n      */}\n      <section className=\"hidden lg:block bg-muted/20 border-t py-20 px-8\">\n        <div className=\"container mx-auto\">\n          <div className=\"grid md:grid-cols-2 lg:grid-cols-4 gap-12 mb-20 text-right\">\n            <div className=\"space-y-4\">\n              <div className=\"flex items-center gap-3 justify-end text-primary mb-4 border-b border-primary/20 pb-2\">\n                <h3 className=\"text-xl font-black italic\">قيمنا الأساسية</h3>\n                <Star className=\"h-6 w-6\" />\n              </div>\n              <p className=\"text-sm leading-relaxed text-muted-foreground\">\n                نحن في 911 Heritage لا نؤمن بمجرد البيع، بل نؤمن بالصيانة الدائمة للتراث. بورش 911 ليست مجرد وسيلة نقل، بل هي تعبير عن فلسفة هندسية بدأت في عام 1963 مع أول طراز طرحه فارديناند بورش. نحن نلتزم بالدقة الألمانية في كل تفاعل، من الفحص الفني الأولي إلى خدمات ما بعد البيع المتميزة التي تضمن بقاء سيارتك في حالة المصنع لعقود قادمة.\n              </p>\n            </div>\n\n            <div className=\"space-y-4\">\n              <div className=\"flex items-center gap-3 justify-end text-primary mb-4 border-b border-primary/20 pb-2\">\n                <h3 className=\"text-xl font-black italic\">الهندسة المتقدمة</h3>\n                <Zap className=\"h-6 w-6\" />\n              </div>\n              <p className=\"text-sm leading-relaxed text-muted-foreground\">\n                تعتبر بورش 911 المعيار الذهبي للمحركات الخلفية (Rear-Engine layout). هذا التصميم الفريد يوفر توازناً استثنائياً وقدرة على التسارع تخرجك من المنعطفات بقوة لا تضاهى. مع تقنيات مثل نظام التعليق النشط (PASM) وناقل الحركة ثنائي القابض (PDK)، فإننا نوفر لعملائنا أفضل ما توصلت إليه تكنولوجيا السباق، ولكن بمستوى من الفخامة والراحة يصلح للقيادة اليومية في أصعب ظروف الطرق.\n              </p>\n            </div>\n\n            <div className=\"space-y-4\">\n              <div className=\"flex items-center gap-3 justify-end text-primary mb-4 border-b border-primary/20 pb-2\">\n                <h3 className=\"text-xl font-black italic\">التخصيص الفاخر</h3>\n                <Gem className=\"h-6 w-6\" />\n              </div>\n              <p className=\"text-sm leading-relaxed text-muted-foreground\">\n                برنامج التخصيص الحصري لدينا يسمح لك بتصميم سيارة أحلامك كما لم تفعل من قبل. تشمل خياراتنا أنواعاً نادرة من الجلود، وخياطة يدوية دقيقة، بالإضافة إلى لمسات من ألياف الكربون والألمنيوم المصقول. إن امتلاك بورش 911 هو تعبير عن الشخصية، ومهمتنا هي التأكد من أن سيارتك هي انعكاس حقيقي لذوقك الرفيع وتطلعاتك نحو التميز المطلق في عالم السيارات الرياضية الفاخرة.\n              </p>\n            </div>\n\n            <div className=\"space-y-4\">\n              <div className=\"flex items-center gap-3 justify-end text-primary mb-4 border-b border-primary/20 pb-2\">\n                <h3 className=\"text-xl font-black italic\">الاستثمار الذكي</h3>\n                <History className=\"h-6 w-6\" />\n              </div>\n              <p className=\"text-sm leading-relaxed text-muted-foreground\">\n                تاريخياً، تُعد سيارات بورش 911 واحدة من أفضل السيارات في الحفاظ على قيمتها السوقية (Resale Value)، وفي كثير من الأحيان تصبح قطعاً استثمارية ترتفع قيمتها مع مرور الزمن، خاصة إصدارات GT3 RS و Speedster المحدودة. نحن في Heritage نوفر لعملائنا تقارير تحليلية عن حالة السوق العالمي، مما يجعل عملية الشراء ليست مجرد متعة قيادة، بل قراراً مالياً مدروساً ومدعوماً بالبيانات التاريخية.\n              </p>\n            </div>\n          </div>\n\n          <div className=\"bg-zinc-950 p-12 rounded-3xl text-white relative overflow-hidden border border-primary/20\">\n            <div className=\"absolute top-0 left-0 w-full h-full opacity-10 bg-[url('https://images.unsplash.com/photo-1583121274602-3e2820c69888?auto=format&fit=crop&q=80')] bg-cover bg-center\" />\n            <div className=\"relative z-10 grid md:grid-cols-2 gap-12 items-center\">\n              <div className=\"space-y-6 text-right order-2 md:order-1\">\n                <h2 className=\"text-4xl md:text-6xl font-black italic uppercase tracking-tighter\">التزامنا بالريادة</h2>\n                <p className=\"text-gray-400 text-lg leading-relaxed\">\n                  نحن فخورون بكوننا الوجهة المعتمدة في الشرق الأوسط التي تقدم فحص الـ 111 نقطة الصارم، وهو معيار عالمي يضمن أن كل برغي في سيارتك يعمل بكفاءة المصنع. سواء كنت ترغب في اقتناء أحدث موديل 992 أو كنت تبحث عن سيارة كلاسيكية من طراز 964 المهيبة، فإن خبراؤنا هنا لمساعدتك في كل خطوة. نحن لا نبني عملاء فقط، بل نبني مجتمعاً من الشغوفين.\n                </p>\n                <div className=\"flex gap-4 justify-end\">\n                  <div className=\"bg-primary/20 p-4 rounded-2xl border border-primary/30 flex items-center gap-3\">\n                    <CheckBadge className=\"h-6 w-6 text-primary\" />\n                    <span className=\"font-bold\">ضمان ممتد لمدة 10 سنوات</span>\n                  </div>\n                  <div className=\"bg-primary/20 p-4 rounded-2xl border border-primary/30 flex items-center gap-3\">\n                    <Sparkles className=\"h-6 w-6 text-primary\" />\n                    <span className=\"font-bold\">خدمة السطحة المغلقة VIP</span>\n                  </div>\n                </div>\n              </div>\n              <div className=\"order-1 md:order-2 grid grid-cols-2 gap-4\">\n                <img src=\"https://images.unsplash.com/photo-1542281286-9e0a16bb7366?auto=format&fit=crop&w=600\" className=\"rounded-2xl shadow-xl hover:scale-105 transition-transform\" alt=\"Front angle 911\" />\n                <img src=\"https://images.unsplash.com/photo-1611859266238-4b98091d9d9b?auto=format&fit=crop&w=600\" className=\"rounded-2xl shadow-xl hover:scale-105 transition-transform\" alt=\"Interior dashboard\" />\n              </div>\n            </div>\n          </div>\n\n          <div className=\"mt-20 border-t border-border pt-20\">\n            <h4 className=\"text-center text-5xl font-black italic uppercase mb-12 tracking-tight\">سجل الخدمة الموثق</h4>\n            <div className=\"grid md:grid-cols-3 gap-8\">\n              {[\n                {img: \"https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?auto=format&w=500\", title: \"صيانة المحركات المعقدة\", tech: \"Flat-Six Specialist\"},\n                {img: \"https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&w=500\", title: \"العناية الخارجية الفائقة\", tech: \"Liquid Glass Coating\"},\n                {img: \"https://images.unsplash.com/photo-1614162692292-7ac56d7f7f1e?auto=format&w=500\", title: \"ترقية الأداء الرياضي\", tech: \"Performance Tune\"}\n              ].map((item, id) => (\n                <div key={id} className=\"group relative rounded-2xl overflow-hidden aspect-video\">\n                  <img src={item.img} className=\"w-full h-full object-cover group-hover:scale-110 transition-transform duration-700\" alt={item.title} />\n                  <div className=\"absolute inset-0 bg-gradient-to-t from-black/80 via-transparent flex flex-col justify-end p-6 text-right\">\n                    <h5 className=\"text-white text-xl font-black italic\">{item.title}</h5>\n                    <p className=\"text-primary font-bold text-xs uppercase tracking-widest\">{item.tech}</p>\n                  </div>\n                </div>\n              ))}\n            </div>\n          </div>\n        </div>\n      </section>\n\n      {/* SEO Content Block (Footer Optimized) */}\n      <footer className=\"mt-auto\">\n        <section className=\"bg-zinc-900 text-zinc-500 py-12 px-8 text-sm\">\n          <div className=\"container mx-auto max-w-5xl space-y-8 text-right leading-loose\">\n            <h2 className=\"text-zinc-200 text-lg font-bold italic underline decoration-primary underline-offset-8 mb-6\">المرجع الأول لسيارات بورش 911 في المنطقة</h2>\n            <p>\n              أهلاً بكم في 911 Heritage، المؤسسة الرائدة والمتخصصة في بيع وشراء وصيانة أرقى سيارات بورش 911 بمختلف طرازاتها وتاريخها العريق. \n              على مدار ستة عقود، ظلت سيارة بورش 911 رمزاً للطموح والإنجاز، ونحن هنا لنكون الجسر الذي يربطكم بهذا العالم الأسطوري. \n              إننا ندرك أن عميل بورش ليس عميلاً عادياً؛ فهو يبحث عن التميز في الأداء، والدقة في التفاصيل، والشغف الذي ينبض في كل دورة للمحرك سداسي الأسطوانات (Flat-Six).\n            </p>\n            <p>\n              تتنوع تشكيلتنا لتشمل كل ما يحلم به عشاق القيادة؛ بدءاً من طراز \"كاريرا\" المثالي للقيادة اليومية الممتعة، وصولاً إلى طرازات \"تيربو\" التي توفر قوة خارقة وسرعة خاطفة للأنفاس، \n              وانتهاءً بسلسلة \"جي تي\" (GT3, GT3 RS, GT2 RS) التي تمثل جوهر تكنولوجيا حلبات السباق ولكن بصورة قانونية للطرقات. \n              كما نولي اهتماماً خاصاً بالسيارات الكلاسيكية التي تحمل روح السبعينات والثمانينات، حيث نوفر خدمات \"الترميم المعتمد\" لضمان عودة هذه التحف الفنية إلى سابق عهدها.\n            </p>\n            <p>\n              تعتمد فلسفتنا في 911 Heritage على ثلاثة محاور رئيسية: الشفافية المطلقة، الدعم التقني المتخصص، والولاء لعملائنا. \n              كل سيارة نبيعها تمر بسلسلة من الاختبارات الفيزيائية والحاسوبية للتأكد من خلوها من العيوب، ونوفر تقريراً كاملاً عن حالة المحرك، نظام التعليق، وسلامة الهيكل (Chassis Certificate). \n              كما نفخر بتقديم استشارات متخصصة لمساعدة المشترين الجدد في اختيار المواصفات التقنية التي تناسب نمط قيادتهم، \n              سواء كانت رغبتهم تتجه نحو الراحة والهدوء في الرحلات الطويلة أو نحو الأداء الحاد والصلب في عطلات نهاية الأسبوع على الحلبة.\n            </p>\n            <div className=\"grid md:grid-cols-2 gap-8 text-zinc-400\">\n              <div className=\"border-r border-primary/20 pr-6\">\n                <h3 className=\"text-zinc-100 font-bold mb-3 italic\">مركز الخدمة والقطع الأصلية</h3>\n                <p>\n                  نوفر حصرياً قطع غيار بورش الأصلية المستوردة مباشرة من ألمانيا. مركز الخدمة لدينا مجهز بأحدث أدوات التشخيص (PIWIS Tester) التي تضمن دقة البرمجة وفحص المكونات الإلكترونية المعقدة. \n                  نحن نؤمن أن الصيانة الوقائية هي سر طول عمر المحرك، لذا قمنا بتصميم باقات صيانة دورية تشمل تغيير الزيوت المخلقة بالكامل، فحص سوائل التبريد، ومعايرة نظام حقن الوقود بأعلى معايير الجودة العالمية.\n                </p>\n              </div>\n              <div className=\"border-r border-primary/20 pr-6\">\n                <h3 className=\"text-zinc-100 font-bold mb-3 italic\">نادي هيريتيج للملاك</h3>\n                <p>\n                  عند شرائك لسيارة من 911 Heritage، فإنك تنضم تلقائياً لنادينا الحصري. ننظم رحلات قيادة جماعية عبر أفضل الطرق الجبلية والساحلية في المنطقة، \n                  بالإضافة إلى تجمعات دورية تتيح للملاك تبادل الخبرات واستعراض سياراتهم في بيئة راقية. كما يحصل الأعضاء على دعوات خاصة لفعاليات كشف الستار عن الموديلات الجديدة وخصومات حصرية على \"الاكسسوارات\" وقطع الغيار وخدمات التلميع وحماية الطلاء (PPF).\n                </p>\n              </div>\n            </div>\n            <p className=\"text-zinc-600 italic text-center text-xs mt-12 pb-8\">\n              ملاحظة: بورش، وشعار بورش، و911، وكاريرا، وتاركا هي علامات تجارية مسجلة لشركة د.إنغ. ح.ص. ف. بورش إيه جي (Dr. Ing. h.c. F. Porsche AG). 911 Heritage هو مركز مستقل متخصص ولا يدعي تمثيل الشركة الأم بشكل رسمي، بل يسخر خبراته لخدمة عشاق العلامة.\n            </p>\n          </div>\n        </section>\n      </footer>\n      <Toaster position=\"top-center\" />\n    </div>\n  );\n}\n","/routes/signup.tsx":"import { createFileRoute, Link } from '@tanstack/react-router';\nimport { Button } from '@/components/ui/button';\nimport { Input } from '@/components/ui/input';\nimport { Label } from '@/components/ui/label';\nimport { Checkbox } from '@/components/ui/checkbox';\nimport { Card, CardContent } from '@/components/ui/card';\nimport { Badge } from '@/components/ui/badge';\nimport { CheckCircle2, UserPlus, ShieldPlus, Globe, Sparkles, CarFront, Zap, History, Smartphone } from 'lucide-react';\n\nexport const Route = createFileRoute('/signup')({\n  head: () => ({\n    title: 'إنشاء حساب | انضم لعائلة بورش 911',\n    meta: [\n      { name: 'description', content: 'كن جزءاً من النخبة. أنشئ حسابك لبناء سيارة بورش 911 الخاصة بك، الحصول على تمويل فوري للموديلات الجديدة، وولوج عالم السباقات.' },\n    ],\n  }),\n  component: SignupPage,\n});\n\nfunction SignupPage() {\n  return (\n    <div className=\"min-h-screen flex flex-col items-center bg-zinc-50 dark:bg-zinc-950 rtl\" dir=\"rtl\">\n      {/* Top Banner - Visual Strength */}\n      <div className=\"w-full h-[300px] relative overflow-hidden bg-black flex items-center justify-center\">\n        <div className=\"absolute inset-0 opacity-60 bg-[url('https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&q=80&w=1600')] bg-cover bg-center\"></div>\n        <div className=\"absolute inset-0 bg-gradient-to-b from-transparent to-zinc-50 dark:to-zinc-950\"></div>\n        <div className=\"relative z-10 text-center px-4\">\n          <Badge className=\"bg-primary mb-4 px-6 py-1 text-sm font-bold animate-pulse\">خطوة واحدة نحو الأسطورة</Badge>\n          <h1 className=\"text-4xl md:text-6xl font-black text-white tracking-widest uppercase mb-4 shadow-sm\">ابدأ رحلة بورش الخاصة بك</h1>\n        </div>\n      </div>\n\n      <div className=\"container max-w-6xl -mt-16 px-4 pb-24 grid grid-cols-1 lg:grid-cols-3 gap-8 relative z-20\">\n        {/* Registration Form - Center Column */}\n        <div className=\"lg:col-span-2 space-y-8\">\n           <Card className=\"shadow-2xl border-none p-4 md:p-8 bg-white dark:bg-zinc-900 rounded-3xl overflow-hidden\">\n             <CardContent className=\"space-y-8 pt-6\">\n                <div className=\"flex flex-col md:flex-row gap-8 mb-8\">\n                  <div className=\"flex-1 space-y-4\">\n                    <Label className=\"font-bold flex items-center gap-2\">\n                      <UserPlus className=\"w-4 h-4 text-primary\" /> الاسم الكامل\n                    </Label>\n                    <Input placeholder=\"أدخل اسمك كما في الهوية\" className=\"h-12 text-right\" />\n                  </div>\n                  <div className=\"flex-1 space-y-4\">\n                    <Label className=\"font-bold flex items-center gap-2\">\n                       البريد الإلكتروني\n                    </Label>\n                    <Input id=\"email\" type=\"email\" placeholder=\"email@porsche-club.com\" className=\"h-12 text-left\" dir=\"ltr\" />\n                  </div>\n                </div>\n\n                <div className=\"flex flex-col md:flex-row gap-8\">\n                  <div className=\"flex-1 space-y-4\">\n                    <Label className=\"font-bold flex items-center gap-2\">\n                      كلمة المرور القوية\n                    </Label>\n                    <Input id=\"password\" type=\"password\" placeholder=\"••••••••\" className=\"h-12\" />\n                    <p className=\"text-[10px] text-zinc-400\">يجب أن تحتوي على 8 رموز، رقم واحد، وحرف كبير على الأقل.</p>\n                  </div>\n                  <div className=\"flex-1 space-y-4\">\n                    <Label className=\"font-bold flex items-center gap-2\">\n                       تأكيد كلمة المرور\n                    </Label>\n                    <Input type=\"password\" placeholder=\"••••••••\" className=\"h-12\" />\n                  </div>\n                </div>\n\n                <div className=\"pt-4 border-t border-zinc-100 dark:border-zinc-800 space-y-6\">\n                  <div className=\"flex items-start gap-3\">\n                    <Checkbox id=\"terms\" className=\"mt-1\" />\n                    <Label htmlFor=\"terms\" className=\"text-sm leading-relaxed text-zinc-600 cursor-pointer\">\n                      أوافق على <Link to=\"/\" className=\"text-primary hover:underline font-bold\">شروط البيع والاستخدام</Link> وبنود الخصوصية الخاصة بشركة بورش. أدرك أن بياناتي ستتم معالجتها في خوادمنا بألمانيا لتقديم أفضل تجربة شراء.\n                    </Label>\n                  </div>\n                  <div className=\"flex items-start gap-3\">\n                    <Checkbox id=\"marketing\" className=\"mt-1\" />\n                    <Label htmlFor=\"marketing\" className=\"text-sm leading-relaxed text-zinc-600 cursor-pointer\">\n                      أريد تلقي دعوات حصرية لفعاليات \"بورش في الحلبة\" وكتالوجات الموديلات الجديدة عبر البريد الإلكتروني.\n                    </Label>\n                  </div>\n                </div>\n\n                <Button className=\"w-full h-14 text-xl font-black bg-primary hover:bg-primary/90 text-white rounded-xl shadow-xl shadow-primary/20 transition-all hover:scale-[1.01] active:scale-95\">\n                  تأكيد الانضمام للعائلة\n                </Button>\n\n                <div className=\"text-center text-sm\">\n                  تمتلك حساباً بالفعل؟ <Link to=\"/login\" className=\"text-primary font-bold hover:underline\">سجل دخولك هنا</Link>\n                </div>\n             </CardContent>\n           </Card>\n\n           {/* Why join Section - Real Content */}\n           <div className=\"grid grid-cols-1 md:grid-cols-2 gap-8 pt-8\">\n              <section className=\"space-y-4\">\n                 <div className=\"w-12 h-12 rounded-2xl bg-zinc-900 text-white flex items-center justify-center shadow-lg\">\n                    <History className=\"w-6 h-6\" />\n                 </div>\n                 <h3 className=\"text-xl font-bold italic\">نظام التتبع الذكي</h3>\n                 <p className=\"text-muted-foreground leading-relaxed\">\n                   بمجرد تأكيد حسابك، ستحصل على وصول لنظام \"My Porsche\". هذا التطبيق يراقب الحالة الميكانيكية لسيارتك 911 في الوقت الفعلي، من ضغط الإطارات وصولاً إلى حالة شفرات التبريد النشطة، ويرسل تنبيهات لهاتفك عند حاجتك للصيانة.\n                 </p>\n              </section>\n              <section className=\"space-y-4\">\n                 <div className=\"w-12 h-12 rounded-2xl bg-primary text-white flex items-center justify-center shadow-lg\">\n                    <Smartphone className=\"w-6 h-6\" />\n                 </div>\n                 <h3 className=\"text-xl font-bold italic\">مفتاح بورش الرقمي</h3>\n                 <p className=\"text-muted-foreground leading-relaxed\">\n                   حسابك هو مفتاحك. يمكنك فتح محرك سيارتك وبدء التشغيل عن بعد عبر هاتفك، وتخصيص درجة حرارة المقصورة قبل الدخول إليها بـ 10 دقائق لتكون مثالية بمجرد جلوسك على المقاعد الرياضية المريحة.\n                 </p>\n              </section>\n           </div>\n        </div>\n\n        {/* Info Column - Benefits & Status */}\n        <aside className=\"space-y-8\">\n           <div className=\"bg-zinc-900 text-white rounded-3xl p-8 space-y-6\">\n              <h4 className=\"text-2xl font-black border-r-4 border-primary pr-4\">مميزات العضوية</h4>\n              <ul className=\"space-y-6\">\n                {[\n                  { icon: <Zap />, t: 'تمويل سريع', d: 'موافقة فورية على خطط التقسيط لملاك النخبة.' },\n                  { icon: <Sparkles />, t: 'أولوية الصيانة', d: 'مواعيد مخصصة في مراكز بورش المعتمدة في أقل من 24 ساعة.' },\n                  { icon: <Globe />, t: 'فعاليات \"سبت بورش\"', d: 'دعوات غداء وتعارف مع جامعي السيارات الكلاسيكية والحديثة.' },\n                  { icon: <CarFront />, t: 'اختبارات مبكرة', d: 'كن أول من يقود الموديلات الاختبارية تحت إشرافنا.' }\n                ].map((item, i) => (\n                  <li key={i} className=\"flex gap-4 group\">\n                    <div className=\"text-primary group-hover:scale-125 transition-transform\">{item.icon}</div>\n                    <div>\n                      <p className=\"font-bold text-sm mb-1\">{item.t}</p>\n                      <p className=\"text-[11px] text-zinc-400 leading-tight\">{item.d}</p>\n                    </div>\n                  </li>\n                ))}\n              </ul>\n           </div>\n\n           <div className=\"border border-dashed border-zinc-200 p-8 rounded-3xl space-y-6\">\n              <div className=\"flex items-center gap-3\">\n                 <ShieldPlus className=\"w-8 h-8 text-primary\" />\n                 <h5 className=\"font-black\">معايير الأمان 360°</h5>\n              </div>\n              <p className=\"text-xs text-zinc-500 leading-loose\">\n                نحن في بورش نعلم أن الثقة هي أساس السرعة. لذلك نطبق معايير الالتزام التنظيمي الشاملة (GDPR) والأنظمة المحلية لضمان أن رحلتك معنا آمنة تماماً، من لحظة دفع العربون وحتى أول تغيير زيت لسيارتك الجديدة. جميع معاملاتك المالية تتم عبر نظام \"Porsche Pay\" المعزز بتقنيات البلوكشين للتأمين.\n              </p>\n              <img \n                src=\"https://images.unsplash.com/photo-1541899481282-d53bffe3c35d?auto=format&fit=crop&q=80&w=300\" \n                className=\"w-full h-32 object-cover rounded-xl filter grayscale contrast-125\"\n                alt=\"Security\"\n              />\n           </div>\n\n           <div className=\"bg-primary/5 p-6 rounded-2xl flex flex-col items-center text-center gap-4\">\n              <p className=\"text-sm font-bold\">هل تواجه صعوبة في التسجيل؟</p>\n              <p className=\"text-xs text-zinc-500\">فريق الدعم الفني الخاص بعضويات النخبة متاح عبر الهاتف</p>\n              <Button variant=\"outline\" className=\"w-full rounded-full border-primary text-primary font-bold\">800-911-PORSCHE</Button>\n           </div>\n        </aside>\n      </div>\n\n      {/* Extended Brand Story Footer Section to meet character requirement */}\n      <section className=\"w-full bg-white dark:bg-zinc-900 py-24 border-t\">\n        <div className=\"container px-4 text-center\">\n            <h2 className=\"text-4xl font-black mb-12\">\"في البداية نظرت حولي، لكنني لم أجد السيارة التي أحلم بها، لذا قررت بناؤها بنفسي.\"</h2>\n            <p className=\"text-zinc-400 italic mb-8\">— فيري بورش</p>\n            <div className=\"max-w-4xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-12 text-right\">\n                <p className=\"text-zinc-600 leading-loose\">\n                    هذه المقولة هي حجر الزاوية الذي بنيت عليه كل قطعة غيار في سيارة 911 التي تتطلع لشرائها اليوم. عندما تنشئ حساباً معنا، أنت لا تقوم بعملية تسجيل روتينية، بل توقع ميثاق ارتباط مع واحدة من أرقى العلامات الهندسية في تاريخ البشرية. من غابة \"أردين\" في بلجيكا حيث تُختبر سرعة دوران الإطارات، إلى سهال \"نيفادا\" حيث تُمتحن أنظمة التبريد في أقسى الظروف، تظل بورش وفية لجذورها: البناء من أجل السائق.\n                </p>\n                <p className=\"text-zinc-600 leading-loose\">\n                    نظامنا الرقمي مصمم ليعكس هذه الفلسفة. الدقة المطلقة والوضوح التام. من خلال بوابة العميل، ستتمكن من رؤية العقد القانوني لسيارتك، تفاصيل الضمان العالمي الذي يغطي أكثر من 150 دولة، وشهادة الأصالة الموقعة لسيارتك 911. كما سنوفر لك سجل \"تطابق الأرقام\" وهو توثيق تاريخي يضمن أن محرك سيارتك وهيكلها هما زوج أصلي لا ينفصل، ما يرفع قيمة سيارتك الاستثمارية في سوق السيارات الكلاسيكية مستقبلاً.\n                </p>\n            </div>\n        </div>\n      </section>\n    </div>\n  );\n}\n","/index.css":"@tailwind base;\n@tailwind components;\n@tailwind utilities;\n\n@layer base {\n  :root {\n    --background: 0 0% 100%;\n    --foreground: 222.2 84% 4.9%;\n    --card: 0 0% 100%;\n    --card-foreground: 222.2 84% 4.9%;\n    --popover: 0 0% 100%;\n    --popover-foreground: 222.2 84% 4.9%;\n    --primary: 0 72% 51%;\n    --primary-foreground: 210 40% 98%;\n    --secondary: 210 40% 96.1%;\n    --secondary-foreground: 222.2 47.4% 11.2%;\n    --muted: 210 40% 96.1%;\n    --muted-foreground: 215.4 16.3% 46.9%;\n    --accent: 210 40% 96.1%;\n    --accent-foreground: 222.2 47.4% 11.2%;\n    --destructive: 0 84.2% 60.2%;\n    --destructive-foreground: 210 40% 98%;\n    --border: 214.3 31.8% 91.4%;\n    --input: 214.3 31.8% 91.4%;\n    --ring: 0 72% 51%;\n    --radius: 0.5rem;\n  }\n}\n\nbody {\n  background-color: hsl(var(--background));\n  color: hsl(var(--foreground));\n}\n","/components/ui/sheet.tsx":"import * as React from \"react\";\nimport * as SheetPrimitive from \"@radix-ui/react-dialog\";\nimport { X } from \"lucide-react\";\nimport { cva, type VariantProps } from \"class-variance-authority\";\nimport { cn } from \"@/lib/utils\";\n\nconst Sheet = SheetPrimitive.Root;\nconst SheetTrigger = SheetPrimitive.Trigger;\nconst SheetClose = SheetPrimitive.Close;\nconst SheetPortal = SheetPrimitive.Portal;\n\nconst SheetOverlay = React.forwardRef<\n  React.ElementRef<typeof SheetPrimitive.Overlay>,\n  React.ComponentPropsWithoutRef<typeof SheetPrimitive.Overlay>\n>(({ className, ...props }, ref) => (\n  <SheetPrimitive.Overlay\n    className={cn(\n      \"fixed inset-0 z-50 bg-black/80  data-[state=open]:animate-in data-[state=closed]:animate-out data-[state=closed]:fade-out-0 data-[state=open]:fade-in-0\",\n      className\n    )}\n    {...props}\n    ref={ref}\n  />\n));\nSheetOverlay.displayName = SheetPrimitive.Overlay.displayName;\n\nconst sheetVariants = cva(\n  \"fixed z-50 gap-4 bg-background p-6 shadow-lg transition ease-in-out data-[state=open]:animate-in data-[state=closed]:animate-out data-[state=closed]:duration-300 data-[state=open]:duration-500\",\n  {\n    variants: {\n      side: {\n        top: \"inset-x-0 top-0 border-b data-[state=closed]:slide-out-to-top data-[state=open]:slide-in-from-top\",\n        bottom:\n          \"inset-x-0 bottom-0 border-t data-[state=closed]:slide-out-to-bottom data-[state=open]:slide-in-from-bottom\",\n        left: \"inset-y-0 left-0 h-full w-3/4 border-r data-[state=closed]:slide-out-to-left data-[state=open]:slide-in-from-left sm:max-w-sm\",\n        right:\n          \"inset-y-0 right-0 h-full w-3/4 border-l data-[state=closed]:slide-out-to-right data-[state=open]:slide-in-from-right sm:max-w-sm\",\n      },\n    },\n    defaultVariants: {\n      side: \"right\",\n    },\n  }\n);\n\ninterface SheetContentProps\n  extends React.ComponentPropsWithoutRef<typeof SheetPrimitive.Content>,\n    VariantProps<typeof sheetVariants> {}\n\nconst SheetContent = React.forwardRef<\n  React.ElementRef<typeof SheetPrimitive.Content>,\n  SheetContentProps\n>(({ side = \"right\", className, children, ...props }, ref) => (\n  <SheetPortal>\n    <SheetOverlay />\n    <SheetPrimitive.Content\n      ref={ref}\n      className={cn(sheetVariants({ side }), className)}\n      {...props}\n    >\n      {children}\n      <SheetPrimitive.Close className=\"absolute right-4 top-4 rounded-sm opacity-70 ring-offset-background transition-opacity hover:opacity-100 focus:outline-none focus:ring-2 focus:ring-ring focus:ring-offset-2 disabled:pointer-events-none data-[state=open]:bg-secondary\">\n        <X className=\"h-4 w-4\" />\n        <span className=\"sr-only\">Close</span>\n      </SheetPrimitive.Close>\n    </SheetPrimitive.Content>\n  </SheetPortal>\n));\nSheetContent.displayName = SheetPrimitive.Content.displayName;\n\nexport { Sheet, SheetPortal, SheetOverlay, SheetTrigger, SheetClose, SheetContent };\n","/styles.css":"@import \"tailwindcss\";\n\n@plugin \"tailwindcss-animate\";\n\n@custom-variant dark (&:is(.dark *));\n\n@theme {\n  --font-sans: \"Inter\", ui-sans-serif, system-ui, sans-serif, \"Apple Color Emoji\",\n    \"Segoe UI Emoji\", \"Segoe UI Symbol\", \"No ;\nimport { ChevronRight } from 'lucide-react';\n\nexport const Route = createFileRoute('/models')({\n  head: () => ({\n    title: 'موديلات بورش 911 | تشكيلة 2024-2025',\n    meta: [\n      { name: 'description', content: 'اكتشف كل إصدارات بورش 911: كاريرا، تارجا، كابريوليه، وتيربو. قارن بين المواصفات والأسعار.' },\n    ],\n  }),\n  component: ModelsPage,\n});\n\nconst modelGroups = [\n  {\n    title: '911 Carrera',\n    models: [\n      { name: 'Carrera', hp: '385', price: '450,000' },\n      { name: 'Carrera S', hp: '450', price: '520,000' },\n      { name: 'Carrera 4S', hp: '450', price: '550,000' },\n    ]\n  },\n  {\n    title: '911 Turbo',\n    models: [\n      { name: 'Turbo', hp: '580', price: '820,000' },\n      { name: 'Turbo S', hp: '650', price: '980,000' },\n    ]\n  },\n  {\n    title: '911 GT',\n    models: [\n      { name: 'GT3 S', hp: '510', price: '850,000' },\n      { name: 'GT3 RS', hp: '525', price: '1,200,000' },\n    ]\n  }\n];\n\nfunction ModelsPage() {\n  return (\n    <div className=\"pt-24 min-h-screen bg-white rtl\" dir=\"rtl\">\n      <div className=\"container mx-auto px-4 py-12\">\n        <header className=\"mb-16 text-center\">\n          <h1 className=\"text-5xl font-black mb-6\">عائلة 911</h1>\n          <p className=\"text-xl text-muted-foreground max-w-3xl mx-auto\">\n            من الكاريرا الكلاسيكية إلى التيربو الفائقة، كل طراز مصمم لتقديم روح بورش الأصيلة بلمسة عصرية.\n          </p>\n        </header>\n\n        <div className=\"space-y-24\">\n          {modelGroups.map((group, idx) => (\n            <div key={idx} className=\"space-y-8\">\n              <h2 className=\"text-3xl font-bold flex items-center gap-4\">\n                {group.title}\n                <div className=\"h-[2px] flex-grow bg-zinc-100\"></div>\n              </h2>\n              <div className=\"grid grid-cols-1 lg:grid-cols-2 gap-8\">\n                {group.models.map((m, mIdx) => (\n                  <Card key={mIdx} className=\"overflow-hidden border-zinc-200 hover:border-primary transition-all group\">\n                    <CardContent className=\"p-0 flex flex-col md:flex-row h-full\">\n                      <div className=\"md:w-1/2 p-8 flex flex-col justify-between\">\n                        <div>\n                          <Badge variant=\"outline\" className=\"mb-4\">موديل 2025</Badge>\n                          <h3 className=\"text-4xl font-black mb-2 tracking-tighter\">{m.name}</h3>\n                          <div className=\"space-y-1 mb-8\">\n                            <p className=\"text-muted-foreground flex justify-between\">\n                              <span>قوة المحرك:</span>\n                              <span className=\"text-foreground font-bold\">{m.hp} حصان</span>\n                            </p>\n                            <p className=\"text-muted-foreground flex justify-between\">\n                              <span>السعر الأساسي:</span>\n                              <span className=\"text-primary font-bold\">{m.price} ريال</span>\n                            </p>\n                          </div>\n                        </div>\n                        <Button className=\"w-full text-lg h-12 rounded-none\">تخصيص الموديل <ChevronRight className=\"ml-2 w-5 h-5 rotate-180\" /></Button>\n                      </div>\n                      <div className=\"md:w-1/2 bg-zinc-100 overflow-hidden relative min-h-[250px]\">\n                        <img \n                          src=\"https://images.unsplash.com/photo-1541899481282-d53bffe3c35d?auto=format&fit=crop&q=80&w=400\" \n                          alt={m.name}\n                          className=\"w-full h-full object-cover group-hover:scale-105 transition-transform duration-700\"\n                        />\n                      </div>\n                    </CardContent>\n                  </Card>\n                ))}\n              </div>\n            </div>\n          ))}\n        </div>\n      </div>\n    </div>\n  );\n}\n","/routes/contact.tsx":"import { createFileRoute } from '@tanstack/react-router';\nimport { Button } from \"@/components/ui/button\";\nimport { Input } from \"@/components/ui/input\";\nimport { Label } from \"@/components/ui/label\";\nimport { Textarea } from \"@/components/ui/textarea\";\nimport { MapPin, Phone, Mail, Clock, Headphones } from \"lucide-react\";\n\nexport const Route = createFileRoute('/contact')({\n  head: () => ({\n    title: 'تواصل مع بورش | استفسارات المبيعات والخدمة',\n    meta: [\n      { name: 'description', content: 'نحن هنا للإجابة على جميع استفساراتك حول بورش 911. تواصل مع خبراء المبيعات أو احجز موعد صيانة.' },\n    ],\n  }),\n  component: ContactComponent,\n});\n\nfunction ContactComponent() {\n  return (\n    <div className=\"pt-24 min-h-screen bg-zinc-50\">\n      <div className=\"max-w-7xl mx-auto px-4 py-20\">\n        <div className=\"grid grid-cols-1 lg:grid-cols-2 gap-20\">\n          <div>\n            <h1 className=\"text-6xl font-black italic uppercase tracking-tighter mb-8 leading-none\">تواصل <br /> مع <span className=\"text-red-600 italic\">الأسطورة</span></h1>\n            <p className=\"text-xl text-zinc-500 mb-12\">فريقنا من الخبراء جاهز لمساعدتك في تخصيص سيارتك الحلم أو الرد على أي استفسارات تقنية.</p>\n            \n            <div className=\"space-y-8\">\n                <div className=\"flex items-start gap-6\">\n                    <div className=\"p-4 bg-white dark:bg-zinc-900 shadow-lg rounded-none rotate-3 group hover:rotate-0 transition-transform\">\n                        <MapPin className=\"w-6 h-6 text-red-600\" />\n                    </div>\n                    <div>\n                        <h4 className=\"font-black uppercase italic mb-1\">المعرض الرئيسي</h4>\n                        <p className=\"text-zinc-500 text-sm\">طريق الملك فهد، الرياض، المملكة العربية السعودية</p>\n                    </div>\n                </div>\n                <div className=\"flex items-start gap-6\">\n derline\">+966 500 000 000</p>\n            </div>\n          </div>\n\n          <div className=\"bg-white p-12 shadow-2xl border-t-4 border-red-600\">\n            <h3 className=\"text-3xl font-black italic uppercase mb-8\">أرسل استفسارك</h3>\n            <form className=\"space-y-6\">\n                <div className=\"grid grid-cols-2 gap-6\">\n                    <div className=\"space-y-2\">\n                        <Label htmlFor=\"first-name\">الاسم الأول</Label>\n                        <Input id=\"first-name\" placeholder=\"أحمد\" className=\"rounded-none border-zinc-200\" />\n                    </div>\n                    <div className=\"space-y-2\">\n                        <Label htmlFor=\"last-name\">اسم العائلة</Label>\n                        <Input id=\"last-name\" placeholder=\"الغامدي\" className=\"rounded-none border-zinc-200\" />\n                    </div>\n                </div>\n                <div className=\"space-y-2\">\n                    <Label htmlFor=\"email\">البريد الإلكتروني</Label>\n                    <Input id=\"email\" type=\"email\" placeholder=\"example@gmail.com\" className=\"rounded-none border-zinc-200\" />\n                </div>\n                <div className=\"space-y-2\">\n                    <Label htmlFor=\"interest\">الموديل المهتم به</Label>\n                    <select className=\"w-full bg-transparent border border-zinc-200 p-2 text-sm focus:outline-none focus:ring-2 focus:ring-red-600\">\n                        <option>911 Carrera</option>\n                        <option>911 Turbo S</option>\n                        <option>911 GT3 RS</option>\n                        <option>أخرى / استفسار عام</option>\n                    </select>\n                </div>\n                <div className=\"space-y-2\">\n                    <Label htmlFor=\"message\">رسالتك</Label>\n                    <Textarea id=\"message\" placeholder=\"كيف يمكننا مساعدتك اليوم؟\" className=\"rounded-none border-zinc-200 min-h-[150px]\" />\n                </div>\n                <Button className=\"w-full bg-red-600 hover:bg-red-700 text-white font-black uppercase py-8 text-lg rounded-none shadow-xl shadow-red-600/20\">إرسال الطلب</Button>\n            </form>\n          </div>\n        </div>\n      </div>\n    </div>\n  );\n}\n","/routes/login.tsx":"import { createFileRoute, Link } from '@tanstack/react-router';\nimport { Button } from '@/components/ui/button';\nimport { Input } from '@/components/ui/input';\nimport { Label } from '@/components/ui/label';\nimport { Card, CardContent, CardDescription, CardHeader, CardTitle } from '@/components/ui/card';\nimport { Badge } from '@/components/ui/badge';\nimport { CheckCircle2, Lock, Car, ShieldCheck, Mail, ArrowRight } from 'lucide-react';\n\nexport const Route = createFileRoute('/login')({\n  head: () => ({\n    title: 'تسجيل الدخول | عالم بورش الحصري',\n    meta: [\n      { name: 'description', content: 'سجل دخولك إلى بوابة ملاك بورش 911. تابع طلباتك، خصص سيارتك الحلم، واحصل على عروض حصرية.' },\n    ],\n  }),\n  component: LoginPage,\n});\n\nfunction LoginPage() {\n  return (\n    <div className=\"min-h-screen flex flex-col md:flex-row rtl\" dir=\"rtl\">\n      {/* Decorative Side - 800+ words/content requirement logic */}\n      <div className=\"hidden md:flex md:w-1/2 bg-zinc-950 relative overflow-hidden flex-col justify-between p-12 text-white\">\n        <div className=\"absolute inset-0 opacity-40 bg-[url('https://images.unsplash.com/photo-1614162692292-7ac56d7f7f1e?auto=format&fit=crop&q=80&w=1200')] bg-cover bg-center\"></div>\n        <div className=\"absolute inset-0 bg-gradient-to-t from-black via-black/20 to-transparent\"></div>\n        \n        <div className=\"relative z-10\">\n          <Link to=\"/\" className=\"flex items-center gap-3 mb-12 group\">\n            <div className=\"w-12 h-12 bg-primary flex items-center justify-center rounded-sm\">\n              <Car className=\"text-white w-8 h-8\" />\n            </div>\n
