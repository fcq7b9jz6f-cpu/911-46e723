ap-12\">\n                <Card className=\"rounded-none border-none bg-white p-10 shadow-sm hover:shadow-xl transition-all group\">\n                    <Globe className=\"w-12 h-12 mb-6 group-hover:text-red-600 transition-colors\" />\n                    <h3 className=\"text-2xl font-black italic uppercase mb-4\">التزام عالمي</h3>\n                    <p className=\"text-zinc-500 leading-relaxed font-light\">نحن نسعى لتقليل بصمتنا الكربونية مع الحفاظ على الأداء الذي يجعل بورش بورش، عبر تقنيات الوقود الإلكتروني والكهرباء.</p>\n                </Card>\n                <Card className=\"rounded-none border-none bg-white p-10 shadow-sm hover:shadow-xl transition-all group\">\n                    <ShieldCheck className=\"w-12 h-12 mb-6 group-hover:text-red-600 transition-colors\" />\n                    <h3 className=\"text-2xl font-black italic uppercase mb-4\">الجودة المطلقة</h3>\n                    <p className=\"text-zinc-500 leading-relaxed font-light\">أكثر من 70% من جميع سيارات بورش التي تم بناؤها على الإطلاق لا تزال تسير على الطرقات اليوم - شهادة حية على هندستنا.</p>\n                </Card>\n                <Card className=\"rounded-none border-none bg-white p-10 shadow-sm hover:shadow-xl transition-all group\">\n                    <Award className=\"w-12 h-12 mb-6 group-hover:text-red-600 transition-colors\" />\n                    <h3 className=\"text-2xl font-black italic uppercase mb-4\">الدقة اليدوية</h3>\n                    <p className=\"text-zinc-500 leading-relaxed font-light\">على الرغم من التكنولوجيا، لا تزال اللمسة البشرية في مصنع زوفنهاوسن هي التي تضمن الكمال في التفاصيل النهائية.</p>\n                </Card>\n            </div>\n        </div>\n      </section>\n\n      <div className=\"bg-black py-40 text-center relative overflow-hidden\">\n        <div className=\"absolute inset-0 bg-red-600/50 opacity-20 blur-[100px] rounded-full scale-150\" />\n        <div className=\"relative z-10 px-4\">\n            <h2 className=\"text-6xl md:text-9xl font-black italic uppercase text-white mb-6\">Born in <span className=\"text-red-600 italic\">Stuttgart</span></h2>\n            <p className=\"text-xl text-zinc-400 font-bold uppercase tracking-[0.5em]\">Defining sports cars for over 60 years</p>\n        </div>\n      </div>\n    </div>\n  );\n}\n\nconst Badge = ({ children, className }: { children: React.ReactNode, className?: string }) => (\n    <span className={`inline-flex items-center rounded-full border px-2.5 py-0.5 text-xs font-semibold transition-colors focus:outline-none focus:ring-2 focus:ring-ring focus:ring-offset-2 ${className}`}>\n        {children}\n    </span>\n);\n","/routes/features.tsx":"import { createFileRoute } from '@tanstack/react-router';\nimport { Gauge, Cpu, Wind, Zap } from \"lucide-react\";\n\nexport const Route = createFileRoute('/features')({\n  head: () => ({\n    title: 'تقنيات بورش 911 | الابتكار خلف الأداء',\n    meta: [\n      { name: 'description', content: 'تعرف على التكنولوجيا المتطورة في محركات البوكسر، ناقل PDK، ونظام PASM للتحكم النشط.' },\n    ],\n  }),\n  component: FeaturesComponent,\n});\n\nfunction FeaturesComponent() {\n  const techs = [\n    {\n      icon: <Cpu className=\"w-12 h-12 text-red-600\" />,\n      title: \"محرك البوكسر (Boxer Engine)\",\n      desc: \"التصميم المسطح للمحرك يسمح بمركز ثقل منخفض، مما يعني ثباتاً استثنائياً في المنعطفات واستجابة لحظية.\"\n    },\n    {\n      icon: <Wind className=\"w-12 h-12 text-red-600\" />,\n      title: \"الديناميكا الهوائية النشطة (PAA)\",\n      desc: \"جناح خلفي يتكيف تلقائياً وفتحات هواء ذكية لتقليل السحب أو زيادة القوة الضاغطة حسب الحاجة.\"\n    },\n    {\n      icon: <Gauge className=\"w-12 h-12 text-red-600\" />,\n      title: \"ناقل الحركة PDK\",\n      desc: \"ناقل حركة مزدوج القابض مع 8 سرعات يجمع بين راحة ناقل الحركة الأوتوماتيكي وديناميكية النقل اليدوي.\"\n    },\n    {\n        icon: <Zap className=\"w-12 h-12 text-red-600\" />,\n        title: \"نظام توجيه المحور الخلفي\",\n        desc: \"يحسن المناورة في السرعات المنخفضة ويزيد الثبات بشكل كبير في السرعات العالية.\"\n    }\n  ];\n\n  return (\n    <div className=\"pt-24 bg-white dark:bg-black overflow-hidden\">\n      <div className=\"max-w-7xl mx-auto px-4 py-20 relative\">\n        <div className=\"absolute top-0 right-0 w-1/2 h-full opacity-5 pointer-events-none\">\n            <span className=\"text-[400px] font-black italic tracking-tighter block rotate-90 translate-x-1/2 translate-y-1/2\">TECH</span>\n        </div>\n\n        <div className=\"relative z-10 max-w-3xl mb-24\">\n            <h1 className=\"text-7xl font-black uppercase italic tracking-tighter mb-8 leading-none\">هندسة <br /> <span className=\"text-red-600\">المستقبل</span></h1>\n            <p className=\"text-2xl text-zinc-500 font-light leading-relaxed\">في بورش، التكنولوجيا ليست غاية، بل وسيلة لتعميق الرابط بين السائق والآلة. كل نظام مصمم بدقة لرفع مستوى الأدرينالين.</p>\n        </div>\n\n        <div className=\"grid grid-cols-1 md:grid-cols-2 gap-x-20 gap-y-32\">\n            {techs.map((t, i) => (\n                <div key={i} className=\"group\">\n                    <div className=\"mb-8 p-6 bg-zinc-50 dark:bg-zinc-900 w-fit inline-block border-l-2 border-red-600\">\n                        {t.icon}\n                    </div>\n                    <h3 className=\"text-3xl font-black uppercase italic mb-6 group-hover:text-red-600 transition-colors\">{t.title}</h3>\n                    <p className=\"text-xl text-zinc-500 leading-relaxed border-t border-zinc-100 dark:border-zinc-800 pt-6\">{t.desc}</p>\n                </div>\n            ))}\n        </div>\n\n        <div className=\"mt-40 bg-black p-12 md:p-24 text-white text-center\">\n            <h2 className=\"text-4xl md:text-6xl font-black italic uppercase mb-8\">هل أنت مستعد لمواجهة الأرقام؟</h2>\n            <div className=\"flex flex-wrap justify-center gap-12 md:gap-24 uppercase font-black\">\n                <div className=\"flex flex-col gap-2\">\n                    <span className=\"text-6xl md:text-8xl text-red-600\">2.7s</span>\n                    <span className=\"text-zinc-500 tracking-widest text-sm\">0 - 100 KM/H</span>\n                </div>\n                <div className=\"flex flex-col gap-2\">\n                    <span className=\"text-6xl md:text-8xl text-red-600\">330</span>\n                    <span className=\"text-zinc-500 tracking-widest text-sm\">TOP SPEED (KM/H)</span>\n                </div>\n                <div className=\"flex flex-col gap-2\">\n                    <span className=\"text-6xl md:text-8xl text-red-600\">650</span>\n                    <span className=\"text-zinc-500 tracking-widest text-sm\">MAX HORSEPOWER</span>\n                </div>\n            </div>\n        </div>\n      </div>\n    </div>\n  );\n}\n","/routes/inventory.tsx":"import { createFileRoute } from '@tanstack/react-router';\nimport { Card } from \"@/components/ui/card\";\nimport { Badge } from \"@/components/ui/badge\";\nimport { Button } from \"@/components/ui/button\";\nimport { Search, Filter, SlidersHorizontal } from \"lucide-react\";\n\nexport const Route = createFileRoute('/inventory')({\n  head: () => ({\n    title: 'مخزون حقيقي بورش 911 | سيارات جاهزة للتسليم',\n    meta: [\n      { name: 'description', content: 'تصفح قائمة السيارات المتوفرة حالياً في معارضنا. سيارات بورش 911 مستعملة ومعتمدة وجديدة كلياً.' },\n    ],\n  }),\n  component: InventoryComponent,\n});\n\nfunction InventoryComponent() {\n  const cars = [\n    { id: 1, title: \"2024 Porsche 911 GT3 RS\", color: \"Python Green\", price: \"1,250,000\", km: \"0 km\", status: \"New\", img: \"https://images.unsplash.com/photo-1611605698335-8b1569810432?q=80&w=800\" },\n    { id: 2, title: \"2023 Porsche 911 Turbo S\", color: \"Guards Red\", price: \"980,000\", km: \"2,400 km\", status: \"Certified Pre-Owned\", img: \"https://images.unsplash.com/photo-1621939514649-280e2ee25f60?q=80&w=800\" },\n    { id: 3, title: \"2024 Porsche 911 Carrera 4S\", color: \"GT Silver\", price: \"612,000\", km: \"0 km\", status: \"New\", img: \"https://images.unsplash.com/photo-1542281286-9e0a16bb7366?q=80&w=800\" },\n    { id: 4, title: \"2022 Porsche 911 Targa 4 GTS\", color: \"Shark Blue\", price: \"720,000\", km: \"11,500 km\", status: \"Used\", img: \"https://images.unsplash.com/photo-1503376780353-7e6692767b70?q=80&w=800\" }\n  ];\n\n  return (\n    <div className=\"pt-24 min-h-screen bg-zinc-50\">\n      <div className=\"max-w-7xl mx-auto px-4 py-16\">\n        <div className=\"flex flex-col md:flex-row justify-between items-start md:items-center gap-8 mb-12\">\n            <div>\n                <h1 className=\"text-4xl font-black italic uppercase tracking-tighter mb-2\">المخزون <span className=\"text-red-600\">المتوفر</span></h1>\n                <p className=\"text-zinc-500 uppercase text-xs font-bold tracking-widest italic\">جميع السيارات تخضع لفحص بورش من 111 نقطة</p>\n            </div>\n            <div className=\"flex items-center gap-4 w-full md:w-auto\">\n                <div className=\"relative flex-grow md:flex-grow-0\">\n                    <Search className=\"absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-zinc-400\" />\n                    <input className=\"bg-white border rounded-none py-2 pl-10 pr-4 w-full md:w-64 text-sm focus:outline-none focus:ring-1 focus:ring-red-600\" placeholder=\"عن ماذا تبحث؟\" />\n                </div>\n                <Button variant=\"outline\" className=\"rounded-none gap-2 font-bold uppercase text-xs h-10\">\n                    <SlidersHorizontal className=\"w-4 h-4\" /> تصفية\n                </Button>\n            </div>\n        </div>\n\n        <div className=\"grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8\">\n            {cars.map((car) => (\n                <Card key={car.id} className=\"rounded-none border-none shadow-lg overflow-hidden group bg-white\">\n                    <div className=\"relative aspect-[4/3] overflow-hidden\">\n                        <img src={car.img} className=\"w-full h-full object-cover grayscale group-hover:grayscale-0 group-hover:scale-110 transition-all duration-700\" alt={car.title} />\n                        <div className=\"absolute top-3 right-3\">\n                            <Badge className={`${car.status === 'New' ? 'bg-red-600' : 'bg-black'} text-white border-none rounded-none text-[10px] uppercase font-black`}>\n                                {car.status}\n                            </Badge>\n                        </div>\n                    </div>\n                    <div className=\"p-6\">\n                        <h3 className=\"text-lg font-black italic uppercase mb-4 line-clamp-1\">{car.title}</h3>\n                        <div className=\"grid grid-cols-2 gap-4 text-[10px] font-bold uppercase tracking-wider text-zinc-400 mb-6 pb-6 border-b\">\n                            <div className=\"flex flex-col gap-1 italic\">\n                                <span>اللون</span>\n                                <span className=\"text-black\">{car.color}</span>\n                            </div>\n                            <div className=\"flex flex-col gap-1 italic\">\n                                <span>المسافة</span>\n                                <span className=\"text-black\">{car.km}</span>\n                            </div>\n                        </div>\n                        <div className=\"flex justify-between items-center\">\n                            <div className=\"flex flex-col\">\n                                <span className=\"text-[9px] text-zinc-400 uppercase font-black\">السعر</span>\n                                <span className=\"text-lg font-black italic text-red-600\">{car.price} ريال</span>\n                            </div>\n                            <Button size=\"sm\" className=\"bg-black text-white hover:bg-zinc-800 rounded-none h-10\">التفاصيل</Button>\n                        </div>\n                    </div>\n                </Card>\n            ))}\n        </div>\n\n        <div className=\"mt-20 p-12 bg-zinc-900 text-white flex flex-col md:flex-row items-center justify-between gap-8\">\n            <div className=\"text-center md:text-right\">\n                <h3 className=\"text-3xl font-black italic uppercase mb-2\">لم تجد ما تبحث عنه؟</h3>\n                <p className=\"text-zinc-400 italic\">يمكننا مساعدتك في تأمين أي موديل بورش 911 من شبكتنا العالمية.</p>\n            </div>\n            <Button className=\"bg-red-600 hover:bg-red-700 text-white rounded-none px-12 py-7 font-black uppercase text-lg italic shadow-xl shadow-red-600/20\">اتصل بخبير المبيعات</Button>\n        </div>\n      </div>\n    </div>\n  );\n}\n","/routes/_authenticated/dashboard.tsx":"import { createFileRoute } from '@tanstack/react-router';\nimport { Card, CardContent, CardHeader, CardTitle } from '@/components/ui/card';\nimport { Car, Clock, Shield, Star } from 'lucide-react';\n\nexport const Route = createFileRoute('/_authenticated/dashboard')({\n  head: () => ({\n    title: 'لوحة التحكم | 911 Heritage',\n  }),\n  component: DashboardPage,\n});\n\nfunction DashboardPage() {\n  return (\n    <div className=\"space-y-8\">\n      <div>\n        <h1 className=\"text-4xl font-black italic uppercase tracking-tighter\">مرحباً بك مجدداً</h1>\n        <p className=\"text-muted-foreground\">أهلاً بك في عالم بورش الحصري. تتبع مسار سيارتك وحجوزاتك هنا.</p>\n      </div>\n\n      <div className=\"grid md:grid-cols-4 gap-6\">\n        {[\n          { label: \"طلبات نشطة\", value: \"2\", icon: <Clock className=\"h-6 w-6 text-blue-500\" /> },\n          { label: \"سيارات في المرآب\", value: \"1\", icon: <Car className=\"h-6 w-6 text-primary\" /> },\n          { label: \"نقاط الولاء\", value: \"1,250\", icon: <Star className=\"h-6 w-6 text-yellow-500\" /> },\n          { label: \"حالة العضوية\", value: \"بلاتينيوم\", icon: <Shield className=\"h-6 w-6 text-purple-500\" /> },\n        ].map((stat, i) => (\n          <Card key={i} className=\"border-none shadow-md\">\n            <CardHeader className=\"flex flex-row items-center justify-between pb-2 space-y-0\">\n              <CardTitle className=\"text-sm font-medium text-muted-foreground\">{stat.label}</CardTitle>\n              {stat.icon}\n            </CardHeader>\n            <CardContent>\n              <div className=\"text-2xl font-black italic\">{stat.value}</div>\n            </CardContent>\n          </Card>\n        ))}\n      </div>\n\n      <Card className=\"border-none shadow-xl overflow-hidden\">\n        <CardHeader className=\"bg-primary/5 border-b p-8\">\n          <CardTitle className=\"text-2xl font-black italic\">طلبك الأخير</CardTitle>\n        </CardHeader>\n        <CardContent className=\"p-0\">\n          <div className=\"p-8 flex items-center gap-8\">\n            <img src=\"https://images.unsplash.com/photo-1614162692292-7ac56d7f7f1e?auto=format\" className=\"h-24 w-40 object-cover rounded-xl shadow-lg\" />\n            <div className=\"flex-1\">\n              <h4 className=\"text-xl font-black italic\">911 GT3 RS (2024)</h4>\n              <p className=\"text-muted-foreground\">الحالة: تحت المراجعة الفنية</p>\n            </div>\n            <div className=\"text-right\">\n              <p className=\"text-sm text-muted-foreground\">تاريخ الطلب</p>\n              <p className=\"font-bold\">12 أكتوبر 2023</p>\n            </div>\n          </div>\n        </CardContent>\n      </Card>\n    </div>\n  );\n}\n","/App.tsx":"import React from 'react';\nimport { Outlet } from '@tanstack/react-router';\nimport Navbar from './components/site/Navbar';\nimport Footer from './components/site/Footer';\nimport { Toaster } from './components/ui/sonner';\n\nexport default function App() {\n  return (\n    <div className=\"flex flex-col min-h-screen\">\n      <Navbar />\n      <main className=\"flex-grow\">\n        <Outlet />\n      </main>\n      <Footer />\n      <Toaster position=\"top-right\" />\n    </div>\n  );\n}\n","/routes/_authenticated.tsx":"import { createFileRoute, Link, Outlet } from '@tanstack/react-router';\nimport { Button } from '@/components/ui/button';\nimport { Card, CardContent } from '@/components/ui/card';\nimport { \n  LayoutDashboard, \n  Settings, \n  Package, \n  User, \n  LogOut, \n  Bell, \n  Search,\n  ShieldCheck,\n  CreditCard,\n  History\n} from 'lucide-react';\nimport { Badge } from '@/components/ui/badge';\n\nexport const Route = createFileRoute('/_authenticated')({\n  component: AuthenticatedLayout,\n});\n\nfunction AuthenticatedLayout() {\n  return (\n    <div className=\"flex min-h-screen bg-zinc-50 dark:bg-zinc-950 rtl\" dir=\"rtl\">\n      {/* Sidebar Navigation */}\n      <aside className=\"w-64 border-l bg-white dark:bg-zinc-900 hidden md:flex flex-col sticky top-0 h-screen\">\n        <div className=\"p-6 border-b\">\n          <Link to=\"/\" className=\"flex items-center gap-2\">\n            <div className=\"w-8 h-8 bg-primary rounded flex items-center justify-center\">\n              <span className=\"text-white font-bold italic text-xs\">P911</span>\n            </div>\n            <span className=\"font-bold tracking-tighter\">بوابة الملاك</span>\n          </Link>\n        </div>\n        \n        <nav className=\"flex-1 p-4 space-y-2\">\n          <SidebarLink to=\"/_authenticated/dashboard\" icon={<LayoutDashboard className=\"w-5 h-5\" />} label=\"لوحة التحكم\" active />\n          <SidebarLink to=\"/inventory\" icon={<Package className=\"w-5 h-5\" />} label=\"المخزون المتوفر\" />\n          <SidebarLink to=\"/_authenticated/dashboard\" icon={<History className=\"w-5 h-5\" />} label=\"طلبات الشراء\" />\n          <SidebarLink to=\"/_authenticated/dashboard\" icon={<CreditCard className=\"w-5 h-5\" />} label=\"المدفوعات\" />\n          <div className=\"pt-4 mt-4 border-t border-zinc-100 dark:border-zinc-800\">\n             <SidebarLink to=\"/_authenticated/dashboard\" icon={<User className=\"w-5 h-5\" />} label=\"الملف الشخصي\" />\n             <SidebarLink to=\"/_authenticated/dashboard\" icon={<Settings className=\"w-5 h-5\" />} label=\"الإعدادات\" />\n          </div>\n        </nav>\n\n        <div className=\"p-4 border-t mt-auto\">\n          <Button variant=\"ghost\" className=\"w-full justify-start text-red-500 hover:text-red-600 hover:bg-red-50\">\n            <LogOut className=\"ml-2 w-5 h-5\" />\n            تسجيل الخروج\n          </Button>\n        </div>\n      </aside>\n\n      {/* Main Content Area */}\n      <div className=\"flex-1 flex flex-col min-w-0\">\n        <header className=\"h-16 border-b bg-white dark:bg-zinc-900 sticky top-0 z-30 flex items-center justify-between px-8\">\n          <div className=\"flex items-center gap-4 flex-1 max-w-md\">\n            <div className=\"relative w-full\">\n              <Search className=\"absolute right-3 top-1/2 -translate-y-1/2 w-4 h-4 text-zinc-400\" />\n              <input \n                placeholder=\"ابحث عن موديل، رقم طلب...\" \n                className=\"w-full bg-zinc-100 dark:bg-zinc-800 border-none rounded-full py-2 pr-10 text-sm focus:ring-2 ring-primary/20\"\n              />\n            </div>\n          </div>\n          \n          <div className=\"flex items-center gap-4\">\n            <Button variant=\"ghost\" size=\"icon\" className=\"relative\">\n              <Bell className=\"w-5 h-5\" />\n              <span className=\"absolute top-2 left-2 w-2 h-2 bg-primary rounded-full border-2 border-white\"></span>\n            </Button>\n            <div className=\"flex items-center gap-3 border-r pr-4 mr-2\">\n              <div className=\"text-left hidden sm:block\">\n                <p className=\"text-xs font-bold leading-none\">أحمد الهاشمي</p>\n                <p className=\"text-[10px] text-zinc-500\">عضوية بريميوم</p>\n              </div>\n              <div className=\"w-10 h-10 rounded-full bg-zinc-200 border-2 border-primary overflow-hidden\">\n                <img src=\"https://images.unsplash.com plash.com/photo-1614162692292-7ac56d7f7f1e?auto=format&fit=crop&q=80&w=400\" \n                    className=\"rounded-2xl shadow-xl rotate-3\"\n                    alt=\"Porsche Member\"\n                  />\n                </div>\n              </div>\n            </section>\n\n            <section className=\"grid grid-cols-1 md:grid-cols-3 gap-6\">\n               <div className=\"space-y-4\">\n                 <h4 className=\"font-bold text-lg border-b pb-2\">الدعم الفني المباشر</h4>\n                 <p className=\"text-sm text-zinc-500 leading-relaxed\">تواصل مع خبير هندسي متخصص من مصنعنا في شتوتغارت لأي استفسارات تقنية حول سيارتك في أي وقت طوال الأسبوع.</p>\n               </div>\n               <div className=\"space-y-4\">\n                 <h4 className=\"font-bold text-lg border-b pb-2\">فعاليات الحلبات</h4>\n                 <p className=\"text-sm text-zinc-500 leading-relaxed\">دعوات حصرية للمشاركة في أيام المضمار (Track Days) لتجربة القدرات القصوى لسيارتك 911 تحت إشراف مدربين محترفين.</p>\n               </div>\n               <div className=\"space-y-4\">\n                 <h4 className=\"font-bold text-lg border-b pb-2\">تحديثات الأداء</h4>\n                 <p className=\"text-sm text-zinc-500 leading-relaxed\">اشترك في نظام التحديثات عبر الهواء (OTA) لضمان حصول محركك وبرامج التحكم على أحدث التقنيات فور صدورها.</p>\n               </div>\n            </section>\n\n            <section>\n               <h4 className=\"font-bold text-xl mb-8\">عمليات سابقة تم تنفيذها بنجاح</h4>\n               <div className=\"grid grid-cols-1 md:grid-cols-4 gap-4\">\n                 {[1, 2, 3, 4].map(i => (\n                   <Card key={i} className=\"overflow-hidden group\">\n                     <div className=\"h-32 bg-zinc-100 overflow-hidden\">\n                       <img \n                        src={`https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&q=80&w=200&sig=${i}`} \n                        className=\"w-full h-full   function noteRequired(modulePath, names) {
    if (!names.length) return;
    if (!requiredExports[modulePath]) requiredExports[modulePath] = new Set();
    for (const n of names) requiredExports[modulePath].add(n);
  }

  async function loadModule(path) {
    if (moduleCache[path]) return moduleCache[path];
    const src = FILES[path];
    if (src === undefined) throw new Error('Module not found: ' + path);

    let code;
    if (path.endsWith('.css')) {
      code = makeCssModule(src, path);
    } else {
      code = transformJs(src, path);

      // Find every relative dep and pre-load it (also note named bindings consumers want)
      const deps = [];
      let m;
      const re = new RegExp(IMPORT_RE.source, 'g');
      while ((m = re.exec(code)) !== null) {
        const prefix = m[1];
        const spec = m[3];
        const resolved = resolvePath(path, spec);
        if (resolved) {
          deps.push({ spec, resolved });
          noteRequired(resolved, extractNamedBindings(prefix));
        }
      }
      const depUrls = {};
      for (const d of deps) {
        depUrls[d.spec] = await loadModule(d.resolved);
      }
      const re2 = new RegExp(IMPORT_RE.source, 'g');
      code = code.replace(re2, function(_full, prefix, q, spec, q2){
        if (depUrls[spec]) return prefix + q + depUrls[spec] + q2;
        return _full;
      });

      // Shim 1: ensure a default export exists so 'import X from "./mod"' never fails.
      const hasDefault = /export\s+default\b/.test(code)
        || /export\s*\{[^}]*\bdefault\b[^}]*\}/.test(code)
        || /export\s*\{[^}]*\bas\s+default\b[^}]*\}/.test(code);
      if (!hasDefault) {
        code += "\n;export default {};\n";
      }

      // Named local imports are converted to namespace imports above, so we no
      // longer mutate a module's export table here. Mutating exports caused hard
      // browser syntax errors like "Duplicate export of 'seedProducts'".
    }

    const blob = new Blob([code], { type: 'text/javascript' });
    const url = URL.createObjectURL(blob);
    moduleCache[path] = url;
    return url;
  }

  // Pre-pass: scan every file's raw source so that requiredExports is fully
  // populated BEFORE any module is transformed/cached. Without this, a module
  // loaded earlier than one of its consumers wouldn't get the backfill.
  function prescanRequiredExports() {
    for (const filePath of Object.keys(FILES)) {
      if (!/\.(jsx?|tsx?)$/.test(filePath)) continue;
      const code = FILES[filePath];
      const re = new RegExp(IMPORT_RE.source, 'g');
      let m;
      while ((m = re.exec(code)) !== null) {
        const prefix = m[1];
        const spec = m[3];
        const resolved = resolvePath(filePath, spec);
        if (resolved) noteRequired(resolved, extractNamedBindings(prefix));
      }
    }
  }

  (async () => {
    try {
      prescanRequiredExports();
      const entryUrl = await loadModule(ENTRY);
      await import(entryUrl);
    } catch (err) {
      console.error('[Webly]', err);
      const msg = (err && err.stack) ? err.stack : String(err);
      document.getElementById('root').innerHTML =
        '<div style="padding:24px;font-family:ui-monospace,monospace;direction:ltr;text-align:left;min-height:100vh;background:#0f172a">' +
        '<h2 style="color:#f87171;margin:0 0 12px">Webly Runtime Error</h2>' +
        '<pre style="white-space:pre-wrap;color:#fecaca;background:#1e293b;padding:16px;border-radius:8px;border:1px solid #b91c1c;font-size:13px">' +
        msg.replace(/[&<>]/g, function(c){ return ({ '&':'&amp;','<':'&lt;','>':'&gt;' })[c]; }) +
        '</pre></div>';
    }
  })();
</script>
</body>
